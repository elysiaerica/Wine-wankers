<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wine Wankers — Good Wine. Good People.</title>
<meta name="description" content="Monthly natural wine tastings and wine community - West End Brisbane. Get on the list.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* ══════════════════════════════════════════
WINE WANKERS — GOOD WINE. GOOD PEOPLE.
Landing Page — Hero + Email Capture Only
══════════════════════════════════════════ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--deep:#0e0e0e;
--warm:#1a1a1f;
--card:#252528;
--cream:#f7f4ee;
--paper:#fffef9;
--pink:#e040a0;
--wine:#6b1a2a;
--sr:#e84545;--so:#f5a623;--sy:#f7dc6f;--sg:#52be80;
--st:#48c9b0;--sb:#2db5e8;--sv:#af7ac5;--sm:#e040a0;
--txt-primary:#f7f4ee;
--txt-dim:rgba(247,244,238,.65);
--txt-ghost:rgba(247,244,238,.35);
--border:rgba(255,255,255,.07);
--display:'Syne',sans-serif;
--fd:'Instrument Serif',Georgia,serif;
--fb:'Newsreader',Georgia,serif;
--fm:'JetBrains Mono',monospace;
--ease-ui:cubic-bezier(.4,0,.2,1);
--ease-enter:cubic-bezier(.16,1,.3,1);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--deep);color:var(--txt-primary);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button,input{font:inherit;border:none;outline:none}

/* ── SPECTRUM STRIP ── */
.spectrum-strip{height:3px;background:linear-gradient(90deg,var(--sr) 0%,var(--so) 14%,var(--sy) 28%,var(--sg) 42%,var(--st) 56%,var(--sb) 70%,var(--sv) 84%,var(--sm) 100%);background-size:200% 100%;animation:strip-shift 20s linear infinite}
@keyframes strip-shift{0%{background-position:0 0}100%{background-position:200% 0}}

/* ── REVEAL ANIMATION ── */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .6s var(--ease-enter),transform .6s var(--ease-enter)}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-d1{transition-delay:.1s}.reveal-d2{transition-delay:.2s}.reveal-d3{transition-delay:.3s}.reveal-d4{transition-delay:.4s}

/* ── GLOW BUTTON ── */
.glow-btn{display:inline-block;position:relative;padding:16px 44px;background:transparent;color:var(--cream);font-family:var(--fm);font-size:11px;letter-spacing:.2em;text-transform:uppercase;border-radius:2px;cursor:pointer;border:none;font-weight:500;transition:transform .2s var(--ease-enter),box-shadow .2s;z-index:0}
.glow-btn::before{content:'';position:absolute;inset:-2px;border-radius:3px;background:linear-gradient(90deg,var(--sr),var(--so),var(--sy),var(--sg),var(--st),var(--sb),var(--sv),var(--sm));background-size:200% 100%;z-index:-1;animation:gradient-shift 3s linear infinite;transition:filter .2s}
.glow-btn::after{content:'';position:absolute;inset:0;border-radius:2px;background:var(--deep);z-index:-1}
.glow-btn:hover::before{filter:blur(4px);animation-duration:1s}
.glow-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.5)}
.glow-btn:active{transform:translateY(0)}
@keyframes gradient-shift{0%{background-position:0% 0%}100%{background-position:200% 0%}}

/* ── HERO ── */
.hero{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;padding:100px clamp(20px,4vw,48px) 80px;background:var(--deep);gap:0}
.hero-bg{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 70% 30%,rgba(45,181,232,.08) 0%,transparent 50%),radial-gradient(ellipse at 30% 70%,rgba(224,64,160,.06) 0%,transparent 40%),radial-gradient(ellipse at 80% 80%,rgba(247,220,111,.05) 0%,transparent 35%)}
.hero-prism{position:absolute;top:0;right:0;width:50%;height:100%;pointer-events:none;z-index:1}
.hero-prism-glow{position:absolute;top:-10%;right:-15%;width:120%;height:120%;background:conic-gradient(from 190deg at 90% 10%,transparent 0deg,rgba(232,69,69,.12) 10deg,rgba(245,166,35,.15) 25deg,rgba(247,220,111,.20) 42deg,rgba(72,201,176,.14) 60deg,rgba(45,181,232,.12) 78deg,rgba(224,64,160,.11) 100deg,rgba(175,122,197,.08) 120deg,transparent 145deg);filter:blur(35px)}
.hero-prism-hot{position:absolute;top:5%;right:5%;width:80%;height:75%;background:conic-gradient(from 200deg at 95% 5%,transparent 0deg,rgba(232,69,69,.25) 8deg,rgba(245,166,35,.20) 20deg,rgba(247,220,111,.32) 35deg,rgba(72,201,176,.24) 52deg,rgba(45,181,232,.21) 68deg,rgba(224,64,160,.22) 86deg,transparent 105deg);filter:blur(10px)}
.hero-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:20px;max-width:720px;width:100%}
.hero-kicker{font-family:var(--fm);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--txt-ghost)}
.hero-logo{max-width:560px;width:100%}
.hero-title{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.2vw,32px);line-height:1.1;letter-spacing:-.01em;text-transform:lowercase;color:var(--cream)}
@media(max-width:768px){.hero-title{font-size:clamp(26px,6.5vw,32px)}}
.rainbow-stack{text-shadow:2px 2px 0 var(--sr),4px 4px 0 var(--so),6px 6px 0 var(--sy),8px 8px 0 var(--sg),10px 10px 0 var(--st),12px 12px 0 var(--sb),14px 14px 0 var(--sv)}
.hero-support{font-family:var(--fb);font-style:italic;font-size:clamp(15px,1.8vw,18px);color:var(--txt-dim);max-width:640px;white-space:nowrap}
.hero-form{display:flex;gap:8px;max-width:420px;width:100%;margin-top:4px;flex-wrap:wrap;justify-content:center}
.hero-input{flex:1;min-width:200px;padding:14px 18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:2px;color:var(--cream);font-family:var(--fb);font-size:14px;transition:border-color .2s}
.hero-input::placeholder{color:rgba(255,255,255,.35)}
.hero-input:focus{border-color:var(--sy)}
.hero-input.valid{border-color:var(--sg)}
.hero-success{display:none;align-items:center;gap:10px;font-family:var(--fb);font-size:15px;color:var(--sg)}
.hero-success.show{display:flex}
.hero-form.hidden{display:none}

/* ── FOOTER ── */
.footer{padding:32px clamp(20px,4vw,48px);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.footer-logo{font-family:var(--fd);font-style:italic;font-size:15px;color:var(--pink)}
.footer-copy{font-family:var(--fm);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-ghost)}
.footer-social a{font-family:var(--fm);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-ghost);transition:color .2s}
.footer-social a:hover{color:var(--sm)}
.share-btn{background:none;border:none;cursor:pointer;font-family:var(--fm);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-ghost);padding:0;transition:color .2s;display:inline-flex;align-items:center;gap:6px}
.share-btn:hover{color:var(--cream)}
.share-confirm{font-family:var(--fm);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--sg);opacity:0;transition:opacity .3s;pointer-events:none}

/* ── CONFETTI ── */
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
@keyframes confetti-fall{0%{opacity:1;transform:translateY(-20px) rotate(0deg) scale(1)}100%{opacity:0;transform:translateY(100vh) rotate(720deg) scale(.8)}}
.confetti-piece{position:absolute;animation:confetti-fall 2s ease-in forwards}

@media(prefers-reduced-motion:reduce){
.reveal{opacity:1;transform:none;transition:none}
.spectrum-strip{animation:none}
.glow-btn::before{animation:none}
}

</style>
</head>

<script>
(function(){
  'use strict';

  // ═══ REVEAL ON LOAD ═══
  window.addEventListener('load', () => {
    document.querySelectorAll('.hero .reveal').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), 120 + i * 110);
    });
  });

  // ═══ HERO EMAIL CAPTURE ═══
  const heroForm = document.getElementById('heroForm');
  const heroEmail = document.getElementById('heroEmail');
  const heroBtn = document.getElementById('heroBtn');
  const heroSuccess = document.getElementById('heroSuccess');
  const shareBtn = document.getElementById('shareBtn');
  const shareConfirm = document.getElementById('shareConfirm');
  if (shareBtn) {
    shareBtn.addEventListener('click', async () => {
      const url = 'https://winewankers.com.au';
      if (navigator.share && /Mobi|Android/i.test(navigator.userAgent)) {
        try { await navigator.share({ title: 'Wine Wankers', url }); } catch(e) {}
      } else {
        try {
          await navigator.clipboard.writeText(url);
          shareConfirm.style.opacity = '1';
          setTimeout(() => { shareConfirm.style.opacity = '0'; }, 2000);
        } catch(e) {}
      }
    });
  }

  heroEmail.addEventListener('input', () => {
    const valid = heroEmail.checkValidity() && heroEmail.value.includes('@') && heroEmail.value.includes('.');
    heroEmail.classList.toggle('valid', valid);
  });

  function submitHeroEmail(){
    const email = heroEmail.value.trim();
    if(!email || !heroEmail.checkValidity()){
      heroEmail.style.borderColor = 'var(--sr)';
      heroEmail.focus();
      setTimeout(() => { heroEmail.style.borderColor = ''; }, 2000);
      return;
    }

    // MailerLite form submission
    heroBtn.textContent = '...';
    heroBtn.disabled = true;

    const formData = new FormData();
    formData.append('fields[email]', email);
    formData.append('ml-submit', '1');
    formData.append('anticsrf', 'true');

    // Replace 2281377 with your MailerLite form account ID
    fetch('https://assets.mailerlite.com/jsonp/2281377/forms/185623538688853915/subscribe', {
      method: 'POST',
      body: formData,
      mode: 'no-cors'
    }).then(() => {
      heroForm.classList.add('hidden');
      heroSuccess.classList.add('show');
      document.getElementById('shareWrap').style.display = 'block';
      fireConfetti();
    }).catch(() => {
      // Fallback — show success anyway (no-cors always resolves)
      heroForm.classList.add('hidden');
      heroSuccess.classList.add('show');
      document.getElementById('shareWrap').style.display = 'block';
      fireConfetti();
    });
  }

  heroBtn.addEventListener('click', submitHeroEmail);
  heroEmail.addEventListener('keydown', (e) => { if(e.key === 'Enter') submitHeroEmail(); });

  // ═══ CONFETTI ═══
  function fireConfetti(){
    const container = document.getElementById('confettiContainer');
    const colors = ['#e84545','#f5a623','#f7dc6f','#52be80','#48c9b0','#2db5e8','#af7ac5','#e040a0'];
    for(let i = 0; i < 44; i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.cssText = [
        'left:' + Math.random() * 100 + '%',
        'top:40%',
        'background:' + colors[Math.floor(Math.random() * colors.length)],
        'animation-delay:' + (Math.random() * .6) + 's',
        'animation-duration:' + (1.5 + Math.random()) + 's',
        'border-radius:' + (Math.random() > .5 ? '50%' : '2px'),
        'width:' + (4 + Math.random() * 6) + 'px',
        'height:' + (4 + Math.random() * 6) + 'px'
      ].join(';');
      container.appendChild(piece);
    }
    setTimeout(() => { container.innerHTML = ''; }, 3200);
  }

})();
</script>
